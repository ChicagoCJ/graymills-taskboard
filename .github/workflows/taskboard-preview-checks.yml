name: TaskBoard development checks

on:
  push:
    branches:
      - feature/taskboard-3.16a-readonly
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Keep the newest push and PR checks; avoid repeatedly installing the same
# experimental auth dependencies on superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-only placeholders. No live Supabase or Vercel credentials are used.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Next.js
        run: npm run build
      - name: Smoke-test fail-closed MCP authorization
        env:
          # These are inert test UUIDs, not real user or project identifiers.
          CHATGPT_SEO_PROJECT_ID: 11111111-1111-4111-8111-111111111111
          CHATGPT_INTEGRATION_USER_ID: 22222222-2222-4222-8222-222222222222
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/taskboard-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:3000/api/integrations/chatgpt/mcp; then
              break
            fi
            sleep 1
          done

          expect_http() {
            expected="$1"
            method="$2"
            path="$3"
            actual=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request "$method" "http://127.0.0.1:3000$path") || {
              cat /tmp/taskboard-start.log
              exit 1
            }
            if [ "$actual" != "$expected" ]; then
              echo "$method $path: expected HTTP $expected but got $actual"
              cat /tmp/taskboard-start.log
              exit 1
            fi
            echo "PASS $method $path -> HTTP $actual"
          }

          expect_http 401 GET /api/integrations/chatgpt/mcp
          expect_http 401 POST /api/integrations/chatgpt/mcp
          expect_http 503 GET /.well-known/oauth-protected-resource/api/integrations/chatgpt/mcp
      - name: Smoke-test misconfigured OAuth discovery stays disabled
        env:
          CHATGPT_SEO_PROJECT_ID: 11111111-1111-4111-8111-111111111111
          CHATGPT_INTEGRATION_USER_ID: 22222222-2222-4222-8222-222222222222
          CHATGPT_OAUTH_CLIENT_ID: test-only-client
          CHATGPT_OAUTH_ISSUER: https://issuer.example.test
          CHATGPT_OAUTH_RESOURCE: https://wrong-host.example.test/api/integrations/chatgpt/mcp
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3001 > /tmp/taskboard-oauth-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:3001/api/integrations/chatgpt/mcp; then
              break
            fi
            sleep 1
          done

          metadata_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:3001/.well-known/oauth-protected-resource/api/integrations/chatgpt/mcp)
          if [ "$metadata_status" != "503" ]; then
            echo "Expected OAuth discovery to reject a mismatched resource host (503); got $metadata_status"
            cat /tmp/taskboard-oauth-test.log
            exit 1
          fi

          response_headers=$(curl --silent --dump-header - --output /dev/null \
            http://127.0.0.1:3001/api/integrations/chatgpt/mcp)
          echo "$response_headers" | grep -qi '^HTTP/.* 401' || {
            echo "Expected unauthorized request (401)"
            exit 1
          }
          if echo "$response_headers" | grep -qi '^www-authenticate:'; then
            echo "A mismatched resource host must not be advertised via WWW-Authenticate"
            exit 1
          fi
          echo "PASS: OAuth discovery and challenge stay disabled on wrong-host configuration"

  isolated-oauth-prototype:
    name: Isolated OAuth prototype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oauth_ci
          POSTGRES_PASSWORD: oauth_ci_ephemeral_only
          POSTGRES_DB: oauth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oauth_ci -d oauth_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OAUTH_TEST_DATABASE_URL: postgres://oauth_ci:oauth_ci_ephemeral_only@127.0.0.1:5432/oauth_ci
      OAUTH_TEST_SECRET: oauth-ci-only-nonproduction-secret-32-chars
      OAUTH_TEST_BASE_URL: http://127.0.0.1:3030
      OAUTH_TEST_RESOURCE: http://127.0.0.1:3000/api/integrations/chatgpt/mcp
      OAUTH_TEST_ENABLE_SIGNUP: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned prototype dependencies
        working-directory: experiments/oauth-provider
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck isolated OAuth configuration
        working-directory: experiments/oauth-provider
        run: npm run check
      - name: Build isolated OAuth Next.js test service
        working-directory: experiments/oauth-provider
        run: npm run build
      - name: Smoke-test unconfigured OAuth deployment fails closed
        working-directory: experiments/oauth-provider
        run: |
          env -u OAUTH_TEST_DATABASE_URL -u OAUTH_TEST_SECRET -u OAUTH_TEST_BASE_URL \
            -u OAUTH_TEST_RESOURCE -u OAUTH_TEST_ENABLE_SIGNUP \
            npm run start -- --hostname 127.0.0.1 --port 3031 > /tmp/oauth-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:3031/; then
              break
            fi
            sleep 1
          done

          check_status() {
            expected="$1"
            path="$2"
            actual=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:3031$path") || {
              cat /tmp/oauth-test-server.log
              exit 1
            }
            if [ "$actual" != "$expected" ]; then
              echo "Expected $expected from $path, received $actual"
              cat /tmp/oauth-test-server.log
              exit 1
            fi
          }

          check_status 200 /
          check_status 200 /sign-in
          check_status 200 /consent
          check_status 503 /api/auth/get-session
          check_status 503 /.well-known/oauth-authorization-server/api/auth
          echo "PASS: unconfigured OAuth service shows safe pages but rejects auth and discovery"

      - name: Generate schema-qualified OAuth SQL for review
        working-directory: experiments/oauth-provider
        run: |
          npx --yes auth@1.7.18 generate --yes --config ./auth.ts --output ./generated-schema.sql
          test -s ./generated-schema.sql
          echo "Generated migration SQL for review:"
          cat ./generated-schema.sql
      - name: Verify generated migration matches reviewed SQL
        working-directory: experiments/oauth-provider
        run: node verify-generated-schema.mjs
      - name: Migrate disposable OAuth test database
        working-directory: experiments/oauth-provider
        run: npx --yes auth@1.7.18 migrate --yes --config ./auth.ts
      - name: Verify private OAuth login permissions against disposable PostgreSQL
        working-directory: experiments/oauth-provider
        run: node verify-restricted-login.mjs
      - name: Test fail-closed OAuth authorization request
        working-directory: experiments/oauth-provider
        run: npm run test
